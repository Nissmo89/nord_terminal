name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  linux:
    name: Linux Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build qt6-base-dev

      - name: Verify required files exist
        run: |
          test -f CMakeLists.txt
          test -f include/nordterminal/NordTerminal.h
          test -f include/nordterminal/TerminalSession.h
          test -f src/terminal/TerminalSession.cpp

      - name: Configure (CMake)
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DNORD_TERMINAL_BUILD_EXAMPLES=OFF

      - name: Build
        run: cmake --build build --parallel

      - name: Install smoke test
        run: cmake --install build --prefix "${{ github.workspace }}/install"

  windows:
    name: Windows Build
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install minimal Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: "windows"
          target: "desktop"
          arch: "win64_msvc2022_64"
          setup-python: "false"
          aqtversion: "==3.3.*"
          py7zrversion: "==1.1.*"

      - name: Verify required files exist
        shell: bash
        run: |
          test -f CMakeLists.txt
          test -f include/nordterminal/NordTerminal.h
          test -f include/nordterminal/TerminalSession.h
          test -f src/terminal/TerminalSession.cpp

      - name: Configure (CMake)
        run: cmake -S . -B build -A x64 -DNORD_TERMINAL_BUILD_EXAMPLES=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package Windows demo
        shell: pwsh
        run: |
          $exe = Join-Path $pwd "build\Release\nord_terminal_demo.exe"
          if (-not (Test-Path $exe)) {
            throw "Expected demo executable was not found at: $exe"
          }

          $dist = Join-Path $pwd "dist\nord_terminal_demo-windows-x64"
          New-Item -ItemType Directory -Path $dist -Force | Out-Null
          Copy-Item $exe (Join-Path $dist "nord_terminal_demo.exe") -Force

          if (Test-Path (Join-Path $pwd "themes")) {
            Copy-Item (Join-Path $pwd "themes") (Join-Path $dist "themes") -Recurse -Force
          }

          $windeployqt = (Get-Command windeployqt -ErrorAction Stop).Source
          & $windeployqt --release --compiler-runtime --no-translations --dir $dist (Join-Path $dist "nord_terminal_demo.exe")

      - name: Upload Windows demo artifact
        uses: actions/upload-artifact@v7
        with:
          name: nord_terminal_demo-windows-x64
          path: dist/nord_terminal_demo-windows-x64/**
          if-no-files-found: error
